plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lixlim'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'			// MVC

	developmentOnly 'org.springframework.boot:spring-boot-devtools'				// Dev-tool

	compileOnly 'org.projectlombok:lombok'										// Lombok
	annotationProcessor 'org.projectlombok:lombok'								// Lombok

	testImplementation 'org.springframework.boot:spring-boot-starter-test'		// Test
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'				// Test

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'		// Thymeleaf

	implementation 'software.amazon.awssdk:s3:2.32.4'							// AWS:S3
}

tasks.named('test') {
	useJUnitPlatform()
}
